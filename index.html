<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>План тренировок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>💪 План тренировок</h1>
        <p>Твой личный дневник тренировок</p>
    </header>

    <main>
        <!-- Карточка с формой -->
        <section class="card">
            <h2>➕ Добавить тренировку</h2>
            <form id="workout-form">
                <div class="form-group">
                    <label for="exercise">Упражнение</label>
                    <input type="text" id="exercise" placeholder="Например: Жим лёжа" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="sets">Подходы</label>
                        <input type="number" id="sets" min="1" placeholder="4" required>
                    </div>

                    <div class="form-group">
                        <label for="reps">Повторы</label>
                        <input type="number" id="reps" min="1" placeholder="10" required>
                    </div>

                    <div class="form-group">
                        <label for="weight">Вес (кг)</label>
                        <input type="number" id="weight" min="0" step="0.5" placeholder="60">
                    </div>
                </div>

                <div class="form-group">
                    <label for="day">День недели</label>
                    <select id="day">
                        <option>Понедельник</option>
                        <option>Вторник</option>
                        <option>Среда</option>
                        <option>Четверг</option>
                        <option>Пятница</option>
                        <option>Суббота</option>
                        <option>Воскресенье</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Добавить</button>
            </form>
        </section>

                <!-- Карточка со списком тренировок -->
        <section class="card">
            <h2>📋 Мои тренировки</h2>
            
            <!-- Кнопки фильтрации -->
            <div id="filter-buttons" class="filter-buttons">
                <button class="filter-btn active" data-day="all">Все</button>
                <button class="filter-btn" data-day="Понедельник">Пн</button>
                <button class="filter-btn" data-day="Вторник">Вт</button>
                <button class="filter-btn" data-day="Среда">Ср</button>
                <button class="filter-btn" data-day="Четверг">Чт</button>
                <button class="filter-btn" data-day="Пятница">Пт</button>
                <button class="filter-btn" data-day="Суббота">Сб</button>
                <button class="filter-btn" data-day="Воскресенье">Вс</button>
            </div>

            <ul id="workout-list" class="workout-list"></ul>
        </section>
                <!-- Карточка с графиком -->
        <section class="card">
            <h2>📈 Прогресс</h2>
            
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="chart-exercise">Выберите упражнение</label>
                <select id="chart-exercise">
                    <option value="">-- Выберите упражнение --</option>
                </select>
            </div>
            
            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </section>
    </main>
<!-- Подключаем библиотеку для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Наш скрипт -->
    <script src="app.js"></script>
</body>
</html>
